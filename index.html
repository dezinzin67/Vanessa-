<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanessa🍃</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="nome-vanessa">Vanessa🍃</div>

    <button class="refazer" onclick="location.reload()">Refazer</button>

    <audio id="musica" loop>
        <source src="musica/musi3.mp3" type="audio/mpeg">
    </audio>

    <button id="botao-musica" onclick="iniciarMusica()">
        🎵 Iniciar música
    </button>

    <div class="coracoes">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <div class="container">
        <div class="emoji">😉</div>

        <h1>¿Algún día tendré una oportunidad contigo?</h1>

        <p>Não e sério ou talvez seja</p>

        <div class="botoes">
            <button id="sim">Sim! 😍</button>
            <button id="nao">Talvez! 🙂</button>
        </div>

        <p id="mensagem"></p>
    </div>

    <script src="script.js"></script>

    <script>
        function iniciarMusica() {
            const musica = document.getElementById("musica");
            const botao = document.getElementById("botao-musica");

            if (musica.paused) {
                musica.play();
                botao.innerHTML = "⏸ Pausar música";
            } else {
                musica.pause();
                botao.innerHTML = "🎵 Iniciar música";
            }
        }
    </script>

</body>
</html>
